<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Transparent background, no fill -->
  
  <!-- Microphone capsule (top rounded part) -->
  <path d="M 40 20 Q 40 15 50 15 Q 60 15 60 20 L 60 45 Q 60 55 50 55 Q 40 55 40 45 Z" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Microphone stem -->
  <rect x="48" y="55" width="4" height="15" fill="#000" rx="2"/>
  
  <!-- Microphone base -->
  <ellipse cx="50" cy="72" rx="8" ry="3" fill="#000"/>
  
  <!-- Left waveform line 1 -->
  <path d="M 25 40 Q 30 30 35 40" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Left waveform line 2 -->
  <path d="M 20 50 Q 25 35 30 50" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Right waveform line 1 -->
  <path d="M 65 40 Q 70 30 75 40" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Right waveform line 2 -->
  <path d="M 70 50 Q 75 35 80 50" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>